<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: #FFFFFF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  padding: 100px;
  position: relative;
}
.cover-title {
  font-size: 96px;
  font-weight: 900;
  color: #1a1a1a;
  line-height: 1.15;
  margin-bottom: 40px;
  letter-spacing: -2px;
}
.cover-subtitle {
  font-size: 44px;
  color: #666;
  margin-bottom: 60px;
  font-weight: 500;
  line-height: 1.4;
}
.accent-line {
  width: 180px;
  height: 8px;
  background: #E8915F;
  margin-bottom: 60px;
}
.highlight-text {
  font-size: 40px;
  color: #1a1a1a;
  font-weight: 600;
  padding: 16px 0;
  border-bottom: 4px solid #E8915F;
  display: inline-block;
}
.avatar-watermark {
  position: absolute;
  bottom: 100px;
  right: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.avatar-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #E8915F;
  margin-bottom: 16px;
}
.avatar-name {
  font-size: 28px;
  color: #666;
  font-weight: 500;
}
.page-number {
  position: absolute;
  bottom: 100px;
  left: 100px;
  font-size: 32px;
  color: #999;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="cover-title">为什么AI读完资料<br>还是记不住？</div>
  <div class="cover-subtitle">90%的人都忽略了这一点</div>
  <div class="accent-line"></div>
  <div class="highlight-text">亲测有效的方法分享</div>
  
  <div class="avatar-watermark">
    <img class="avatar-circle" src="avatar.jpg" alt="avatar">
    <div class="avatar-name">@栗噔噔</div>
  </div>
  
  <div class="page-number">1/9</div>
</body>
</html>
