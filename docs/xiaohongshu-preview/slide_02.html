<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: #FFFFFF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  padding: 100px;
  position: relative;
}
.content-title {
  font-size: 64px;
  font-weight: 800;
  color: #1a1a1a;
  margin-bottom: 60px;
  line-height: 1.3;
}
.content-body {
  font-size: 40px;
  color: #333;
  line-height: 1.8;
  flex: 1;
}
.content-body p {
  margin-bottom: 36px;
}
.emphasis {
  background: linear-gradient(transparent 60%, #E8915F40 60%);
  padding: 0 8px;
  font-weight: 600;
}
.avatar-watermark {
  position: absolute;
  bottom: 100px;
  right: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.avatar-circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #E8915F;
  margin-bottom: 12px;
}
.avatar-name {
  font-size: 24px;
  color: #666;
  font-weight: 500;
}
.page-number {
  position: absolute;
  bottom: 100px;
  left: 100px;
  font-size: 32px;
  color: #999;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="content-title">你是不是也这样？</div>
  <div class="content-body">
    <p>很多人在面对<span class="emphasis">AI读完资料记不住</span>时，<br>总是感到困惑和无助。</p>
    <p>明明花了很多时间，<br>却看不到效果。</p>
    <p>其实问题不在你，<br>而是<span class="emphasis">方法不对</span>。</p>
  </div>
  
  <div class="avatar-watermark">
    <img class="avatar-circle" src="avatar.jpg" alt="avatar">
    <div class="avatar-name">@栗噔噔</div>
  </div>
  
  <div class="page-number">2/9</div>
</body>
</html>
