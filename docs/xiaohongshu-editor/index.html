<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书图文编辑器 - 栗噔噔</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: #f5f5f5;
  height: 100vh;
  overflow: hidden;
}
.container {
  display: flex;
  height: 100vh;
}

/* 左侧编辑区 */
.editor-panel {
  width: 400px;
  background: white;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.editor-header {
  padding: 20px;
  border-bottom: 1px solid #e0e0e0;
  background: linear-gradient(135deg, #E8915F 0%, #D4814F 100%);
  color: white;
}
.editor-header h1 {
  font-size: 20px;
  margin-bottom: 8px;
}
.editor-header p {
  font-size: 13px;
  opacity: 0.9;
}

/* 幻灯片列表 */
.slide-list {
  padding: 16px;
  border-bottom: 1px solid #e0e0e0;
}
.slide-list h3 {
  font-size: 14px;
  color: #666;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.slides {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
}
.slide-thumb {
  width: 60px;
  height: 80px;
  background: #f5f5f5;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #999;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.slide-thumb.active {
  border-color: #E8915F;
  background: #FFF5F0;
}
.slide-thumb .num {
  position: absolute;
  top: 4px;
  left: 6px;
  font-size: 10px;
  font-weight: 600;
}
.slide-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.add-slide {
  width: 60px;
  height: 80px;
  border: 2px dashed #ddd;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 24px;
  color: #999;
  flex-shrink: 0;
}
.add-slide:hover {
  border-color: #E8915F;
  color: #E8915F;
}

/* 编辑表单 */
.edit-form {
  padding: 20px;
  flex: 1;
  overflow-y: auto;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: #E8915F;
}
.form-group textarea {
  min-height: 120px;
  resize: vertical;
}

/* 图片上传 */
.image-upload {
  border: 2px dashed #ddd;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.image-upload:hover {
  border-color: #E8915F;
  background: #FFF5F0;
}
.image-upload input {
  display: none;
}
.image-upload .icon {
  font-size: 32px;
  margin-bottom: 8px;
}
.image-upload .text {
  font-size: 13px;
  color: #666;
}
.image-preview {
  margin-top: 12px;
  position: relative;
}
.image-preview img {
  width: 100%;
  border-radius: 8px;
}
.image-preview .remove {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 24px;
  height: 24px;
  background: #ff4444;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
}

/* 样式选择 */
.style-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.style-option {
  padding: 12px 8px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.style-option:hover {
  border-color: #E8915F;
}
.style-option.active {
  border-color: #E8915F;
  background: #FFF5F0;
  color: #E8915F;
}

/* 操作按钮 */
.actions {
  padding: 20px;
  border-top: 1px solid #e0e0e0;
  display: flex;
  gap: 12px;
}
.btn {
  flex: 1;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #E8915F 0%, #D4814F 100%);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(232, 145, 95, 0.4);
}
.btn-secondary {
  background: #f5f5f5;
  color: #333;
}
.btn-secondary:hover {
  background: #e8e8e8;
}

/* 右侧预览区 */
.preview-panel {
  flex: 1;
  background: #f0f0f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  position: relative;
}
.preview-container {
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  border-radius: 12px;
  overflow: hidden;
}
.preview-canvas {
  width: 360px;
  height: 480px;
  background: white;
  position: relative;
  overflow: hidden;
}
.preview-canvas img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.preview-info {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
}

/* 下载按钮 */
.download-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: white;
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  border: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.download-btn:hover {
  background: #f5f5f5;
}

/* 画布内容 */
.canvas-content {
  width: 100%;
  height: 100%;
  padding: 40px;
  display: flex;
  flex-direction: column;
  position: relative;
}
.canvas-title {
  font-size: 32px;
  font-weight: 900;
  color: #1a1a1a;
  line-height: 1.2;
  margin-bottom: 16px;
}
.canvas-subtitle {
  font-size: 15px;
  color: #666;
  margin-bottom: 24px;
}
.canvas-accent {
  width: 60px;
  height: 3px;
  background: #E8915F;
  margin-bottom: 24px;
}
.canvas-highlight {
  font-size: 14px;
  color: #1a1a1a;
  font-weight: 600;
  padding: 8px 0;
  border-bottom: 2px solid #E8915F;
  display: inline-block;
}
.canvas-body {
  font-size: 13px;
  color: #333;
  line-height: 1.8;
  flex: 1;
}
.canvas-body p {
  margin-bottom: 12px;
}
.canvas-avatar {
  position: absolute;
  bottom: 40px;
  right: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.canvas-avatar img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #E8915F;
  margin-bottom: 4px;
}
.canvas-avatar span {
  font-size: 10px;
  color: #666;
}
.canvas-page {
  position: absolute;
  bottom: 40px;
  left: 40px;
  font-size: 11px;
  color: #999;
}

/* 响应式 */
@media (max-width: 900px) {
  .container {
    flex-direction: column;
  }
  .editor-panel {
    width: 100%;
    height: 50vh;
  }
  .preview-panel {
    height: 50vh;
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- 左侧编辑区 -->
  <div class="editor-panel">
    <div class="editor-header">
      <h1>🎨 小红书图文编辑器</h1>
      <p>创建你的专属图文笔记</p>
    </div>
    
    <!-- 幻灯片列表 -->
    <div class="slide-list">
      <h3>幻灯片 (1/9)</h3>
      <div class="slides" id="slideList">
        <div class="slide-thumb active" data-index="0">
          <span class="num">1</span>
          封面
        </div>
        <div class="slide-thumb" data-index="1">
          <span class="num">2</span>
          +
        </div>
        <div class="add-slide" onclick="addSlide()">+</div>
      </div>
    </div>
    
    <!-- 编辑表单 -->
    <div class="edit-form">
      <div class="form-group">
        <label>页面类型</label>
        <select id="slideType" onchange="updatePreview()">
          <option value="cover">封面页</option>
          <option value="content">内容页</option>
          <option value="ending">结尾页</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="slideTitle" value="为什么AI读完资料还是记不住？" placeholder="输入标题..." oninput="updatePreview()">
      </div>
      
      <div class="form-group">
        <label>副标题</label>
        <input type="text" id="slideSubtitle" value="90%的人都忽略了这一点" placeholder="输入副标题..." oninput="updatePreview()">
      </div>
      
      <div class="form-group">
        <label>高亮文字</label>
        <input type="text" id="slideHighlight" value="亲测有效的方法分享" placeholder="输入高亮文字..." oninput="updatePreview()">
      </div>
      
      <div class="form-group">
        <label>正文内容</label>
        <textarea id="slideContent" placeholder="输入正文内容..." oninput="updatePreview()"></textarea>
      </div>
      
      <div class="form-group">
        <label>背景图片</label>
        <div class="image-upload" onclick="document.getElementById('bgImage').click()">
          <input type="file" id="bgImage" accept="image/*" onchange="handleImageUpload(event)">
          <div class="icon">📷</div>
          <div class="text">点击上传背景图片</div>
        </div>
        <div id="imagePreview" class="image-preview" style="display:none;">
          <img id="previewImg" src="" alt="">
          <div class="remove" onclick="removeImage()">×</div>
        </div>
      </div>
      
      <div class="form-group">
        <label>页面样式</label>
        <div class="style-options">
          <div class="style-option active" data-style="default">默认</div>
          <div class="style-option" data-style="center">居中</div>
          <div class="style-option" data-style="minimal">极简</div>
        </div>
      </div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="actions">
      <button class="btn btn-secondary" onclick="downloadCurrent()">💾 保存</button>
      <button class="btn btn-primary" onclick="downloadAll()">📥 下载全部</button>
    </div>
  </div>
  
  <!-- 右侧预览区 -->
  <div class="preview-panel">
    <button class="download-btn" onclick="downloadCurrent()">
      ⬇️ 下载本页
    </button>
    
    <div class="preview-container">
      <div class="preview-canvas" id="previewCanvas">
        <div class="canvas-content" id="canvasContent">
          <div class="canvas-title" id="canvasTitle">为什么AI读完资料还是记不住？</div>
          <div class="canvas-subtitle" id="canvasSubtitle">90%的人都忽略了这一点</div>
          <div class="canvas-accent"></div>
          <div class="canvas-highlight" id="canvasHighlight">亲测有效的方法分享</div>
          <div class="canvas-avatar">
            <img src="avatar.jpg" alt="avatar">
            <span>@栗噔噔</span>
          </div>
          <div class="canvas-page">1/9</div>
        </div>
      </div>
      <div class="preview-info">1080 × 1440 px · 点击下载</div>
    </div>
  </div>
</div>

<script>
// 幻灯片数据
let slides = [{
  type: 'cover',
  title: '为什么AI读完资料还是记不住？',
  subtitle: '90%的人都忽略了这一点',
  highlight: '亲测有效的方法分享',
  content: '',
  bgImage: null
}];
let currentSlide = 0;
let bgImageData = null;

// 更新预览
function updatePreview() {
  const title = document.getElementById('slideTitle').value;
  const subtitle = document.getElementById('slideSubtitle').value;
  const highlight = document.getElementById('slideHighlight').value;
  const content = document.getElementById('slideContent').value;
  const type = document.getElementById('slideType').value;
  
  // 更新画布
  document.getElementById('canvasTitle').textContent = title;
  document.getElementById('canvasSubtitle').textContent = subtitle;
  document.getElementById('canvasHighlight').textContent = highlight;
  
  // 更新背景图
  const canvas = document.getElementById('previewCanvas');
  if (bgImageData) {
    canvas.style.backgroundImage = `url(${bgImageData})`;
    canvas.style.backgroundSize = 'cover';
    canvas.style.backgroundPosition = 'center';
  } else {
    canvas.style.backgroundImage = 'none';
    canvas.style.backgroundColor = 'white';
  }
  
  // 保存到当前幻灯片
  slides[currentSlide] = { type, title, subtitle, highlight, content, bgImage: bgImageData };
}

// 处理图片上传
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      bgImageData = e.target.result;
      document.getElementById('previewImg').src = bgImageData;
      document.getElementById('imagePreview').style.display = 'block';
      updatePreview();
    };
    reader.readAsDataURL(file);
  }
}

// 移除图片
function removeImage() {
  bgImageData = null;
  document.getElementById('bgImage').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  updatePreview();
}

// 添加幻灯片
function addSlide() {
  if (slides.length >= 9) {
    alert('最多9张幻灯片');
    return;
  }
  slides.push({
    type: 'content',
    title: '新页面',
    subtitle: '',
    highlight: '',
    content: '',
    bgImage: null
  });
  renderSlideList();
  selectSlide(slides.length - 1);
}

// 渲染幻灯片列表
function renderSlideList() {
  const list = document.getElementById('slideList');
  list.innerHTML = slides.map((slide, i) => `
    <div class="slide-thumb ${i === currentSlide ? 'active' : ''}" data-index="${i}" onclick="selectSlide(${i})">
      <span class="num">${i + 1}</span>
      ${slide.type === 'cover' ? '封面' : slide.type === 'ending' ? '结尾' : '内容'}
    </div>
  `).join('') + '<div class="add-slide" onclick="addSlide()">+</div>';
}

// 选择幻灯片
function selectSlide(index) {
  currentSlide = index;
  const slide = slides[index];
  
  document.getElementById('slideType').value = slide.type;
  document.getElementById('slideTitle').value = slide.title;
  document.getElementById('slideSubtitle').value = slide.subtitle;
  document.getElementById('slideHighlight').value = slide.highlight;
  document.getElementById('slideContent').value = slide.content || '';
  
  bgImageData = slide.bgImage;
  if (bgImageData) {
    document.getElementById('previewImg').src = bgImageData;
    document.getElementById('imagePreview').style.display = 'block';
  } else {
    document.getElementById('imagePreview').style.display = 'none';
  }
  
  renderSlideList();
  updatePreview();
}

// 下载当前页面
function downloadCurrent() {
  const canvas = document.getElementById('previewCanvas');
  
  // 使用 html2canvas 或类似库来渲染
  // 这里简化处理，提示用户使用浏览器截图
  alert('请使用浏览器截图功能保存图片，或使用右键"图片另存为"');
}

// 下载全部
function downloadAll() {
  alert(`准备下载 ${slides.length} 张图片...\n（实际实现需要后端支持或批量截图工具）`);
}

// 样式选择
document.querySelectorAll('.style-option').forEach(option => {
  option.addEventListener('click', function() {
    document.querySelectorAll('.style-option').forEach(o => o.classList.remove('active'));
    this.classList.add('active');
  });
});

// 初始化
updatePreview();
</script>
</body>
</html>
