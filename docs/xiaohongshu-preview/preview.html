<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>小红书图文预览 - 栗噔噔</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: #f5f5f5;
  padding: 40px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
h1 {
  text-align: center;
  margin-bottom: 40px;
  color: #333;
}
.slide {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin-bottom: 40px;
  overflow: hidden;
}
.slide-header {
  background: #E8915F;
  color: white;
  padding: 16px 24px;
  font-weight: 600;
  font-size: 18px;
}
.slide-content {
  padding: 0;
}
iframe {
  width: 100%;
  height: 1440px;
  border: none;
}
.preview-note {
  text-align: center;
  color: #666;
  margin-bottom: 40px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎨 小红书图文预览</h1>
  <p class="preview-note">主题：为什么AI读完资料记不住？｜配色：暖橙色 #E8915F</p>
  
  <div class="slide">
    <div class="slide-header">第 1 张 - 封面</div>
    <div class="slide-content">
      <iframe src="slide_01.html"></iframe>
    </div>
  </div>
  
  <div class="slide">
    <div class="slide-header">第 2 张 - 痛点</div>
    <div class="slide-content">
      <iframe src="slide_02.html"></iframe>
    </div>
  </div>
  
  <div class="slide">
    <div class="slide-header">第 3 张 - 观点1</div>
    <div class="slide-content">
      <iframe src="slide_03.html"></iframe>
    </div>
  </div>
</div>
</body>
</html>
