<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书图文预览 - 栗噔噔</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 40px 20px;
  min-height: 100vh;
}
.container {
  max-width: 900px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 50px;
  color: white;
}
h1 {
  font-size: 42px;
  margin-bottom: 16px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}
.subtitle {
  font-size: 18px;
  opacity: 0.9;
}
.slide-card {
  background: white;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  margin-bottom: 50px;
  overflow: hidden;
}
.slide-header {
  background: linear-gradient(135deg, #E8915F 0%, #D4814F 100%);
  color: white;
  padding: 20px 30px;
  font-weight: 700;
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-number {
  background: rgba(255,255,255,0.3);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.slide-content {
  padding: 30px;
  display: flex;
  justify-content: center;
  background: #f8f8f8;
}
iframe {
  width: 360px;
  height: 480px;
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  background: white;
}
.info {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 40px;
  color: white;
}
.info h3 {
  margin-bottom: 12px;
  font-size: 20px;
}
.info p {
  opacity: 0.9;
  line-height: 1.6;
}
.color-dot {
  display: inline-block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #E8915F;
  vertical-align: middle;
  margin-right: 8px;
  border: 2px solid white;
}
footer {
  text-align: center;
  color: rgba(255,255,255,0.7);
  padding: 40px 0;
  font-size: 14px;
}
@media (max-width: 600px) {
  iframe {
    width: 100%;
    height: 400px;
  }
  h1 {
    font-size: 28px;
  }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎨 小红书图文预览</h1>
    <p class="subtitle">主题：为什么AI读完资料记不住？</p>
  </header>
  
  <div class="info">
    <h3>📋 设计说明</h3>
    <p><span class="color-dot"></span><strong>主题色：暖橙色 #E8915F</strong> — 与你头像的暖光环境呼应</p>
    <p>📐 <strong>尺寸：1080 × 1440 px</strong> — 小红书 3:4 标准比例</p>
    <p>📝 <strong>字体：系统默认中文字体</strong> — 苹方/思源黑体</p>
    <p>👤 <strong>头像水印：右下角圆形</strong> — 带橙色边框</p>
  </div>
  
  <div class="slide-card">
    <div class="slide-header">
      <span class="slide-number">1</span>
      封面页
    </div>
    <div class="slide-content">
      <iframe src="slide_01.html"></iframe>
    </div>
  </div>
  
  <div class="slide-card">
    <div class="slide-header">
      <span class="slide-number">2</span>
      痛点页
    </div>
    <div class="slide-content">
      <iframe src="slide_02.html"></iframe>
    </div>
  </div>
  
  <div class="slide-card">
    <div class="slide-header">
      <span class="slide-number">3</span>
      观点页（带数字徽章）
    </div>
    <div class="slide-content">
      <iframe src="slide_03.html"></iframe>
    </div>
  </div>
  
  <footer>
    <p>小红书商单图文 Skill 预览版 | 栗噔噔 × OpenClaw</p>
  </footer>
</div>
</body>
</html>
